services:
  db:
    image: mysql:8.0.42
    container_name: sgp_sena_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD - copia .env.example a .env y editalo}
      MYSQL_DATABASE: ${DB_NAME:-SistemaGestionProyectosSENA}
      MYSQL_USER: ${DB_USER:-sgp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD - copia .env.example a .env y editalo}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP. Con "localhost" mysqladmin usa el socket, que
      # tambien responde durante el arranque temporal de la imagen (mientras aun
      # corre 001_schema.sql), y el backend arrancaria antes de tiempo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend
    container_name: sgp_sena_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-SistemaGestionProyectosSENA}
      DB_USER: ${DB_USER:-sgp_user}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD - copia .env.example a .env y editalo}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET - copia .env.example a .env y define uno de 32+ caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      # NUEVO: persiste los archivos subidos por los usuarios (multer,
      # ver backend/src/middlewares/upload.middleware.js) entre reinicios
      # del contenedor.
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: sgp_sena_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    name: sgp_sena_db_data
  uploads_data:
    name: sgp_sena_uploads_data
