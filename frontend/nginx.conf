server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # WebSocket de notificaciones en tiempo real (HU-28): necesita el upgrade de HTTP.
  location /ws { proxy_pass http://backend:3000/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 3600s; }
  # Canal SSE de respaldo: sin buffer para que los eventos lleguen al instante.
  location = /api/v1/notificaciones/stream { proxy_pass http://backend:3000/api/v1/notificaciones/stream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
  location /api/ { proxy_pass http://backend:3000/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # NUEVO: sirve los enlaces de descarga de archivos subidos por los usuarios.
  location /uploads/ { proxy_pass http://backend:3000/uploads/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { try_files $uri $uri/ /index.html; }
}
